<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Globing — Compará países</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <a class="site-header__brand" href="#" aria-label="Globeing — inicio">
      <img class="site-header__logo" src="assets/logo.png" alt="Globeing" />
    </a>
    <nav class="site-header__nav" aria-label="Navegación principal">
      <a href="#about">About us</a>
      <a href="#contact">Contact</a>
      <a href="#" class="site-header__cta">Download</a>
    </nav>
  </header>

  <p class="app-header__tagline">Explore the map, filter countries, and drag your picks into the comparison panel to see population and land area side by side.</p>

  <p id="status" class="status">Cargando datos y mapa…</p>

  <main class="app-layout">
    <aside class="app-layout__sidebar">
      <section id="filter-panel" aria-label="Filtros"></section>
      <section id="country-list" class="app-layout__list" aria-label="Lista de países"></section>
    </aside>

    <section class="app-layout__map" aria-label="Mapa interactivo">
      <div id="map-view"></div>
    </section>
  </main>

  <section id="compare-zone" class="app-layout__compare" aria-label="Comparador de países"></section>

  <footer class="app-footer">
    <p>Datos de población y superficie de fuentes públicas (dataset estático). Mapa base: Natural Earth / world-atlas.</p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
